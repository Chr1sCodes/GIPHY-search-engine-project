name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate API service URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.VITE_API_URL?.trim().replace(/^VITE_API_URL=/i, '');
          if (!value) throw new Error('Set the repository Actions variable VITE_API_URL to your deployed Node API service origin.');
          let url;
          try { url = new URL(value); } catch { throw new Error('VITE_API_URL must be a valid HTTPS URL.'); }
          if (url.protocol !== 'https:' || url.pathname !== '/' || url.search || url.hash) {
            throw new Error('VITE_API_URL must be an HTTPS service origin only, with no path/query. Example: https://your-service.onrender.com');
          }
          if (['giphy.com', 'www.giphy.com', 'api.giphy.com'].includes(url.hostname)) {
            throw new Error('VITE_API_URL must point to your deployed Node API proxy, not GIPHY itself.');
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4