name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Pages deployment source
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pages } = await github.rest.repos.getPages(context.repo);
            if (pages.build_type !== 'workflow') {
              core.setFailed('Set Settings > Pages > Build and deployment > Source to GitHub Actions. Branch-based deployment publishes unbuilt source files and overwrites this workflow.');
            }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          if [ -z "$VITE_GIPHY_API_KEY" ]; then
            echo "::error::Add the GIPHY_API_KEY repository Actions secret before deploying."
            exit 1
          fi
          npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4