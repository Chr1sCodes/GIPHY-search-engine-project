services:
  - type: web
    name: loop-giphy-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: ALLOWED_ORIGIN
        value: https://chr1scodes.github.io
      - key: GIPHY_API_KEY
        sync: false